<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>j0b — job hunting console</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1>j0b <span class="logo-dot">.</span></h1>
      <p class="tagline">semi-auto job hunting console</p>
      <span class="pill" id="ollama-pill">ollama: ...</span>
    </div>
  </header>

  <main>
    <!-- ============ PROFILE ============ -->
    <section class="card" id="profile-card">
      <h2>Your profile</h2>
      <div class="grid two">
        <label>Name
          <input id="cand-name" placeholder="Sarga Prasad RS">
        </label>
        <label>Email
          <input id="cand-email" type="email" placeholder="you@gmail.com">
        </label>
        <label>Headline
          <input id="cand-headline" placeholder="Full-stack developer & AI engineer">
        </label>
        <label>LinkedIn
          <input id="cand-linkedin" placeholder="https://linkedin.com/in/...">
        </label>
      </div>
      <label>Summary
        <textarea id="cand-summary" rows="3" placeholder="1-2 sentences about what you do"></textarea>
      </label>
      <label>Skills (comma separated)
        <input id="cand-skills" placeholder="python, react, fastapi, docker">
      </label>

      <div class="row">
        <label class="file-label">
          Resume (PDF / DOCX / TXT)
          <input id="resume-file" type="file" accept=".pdf,.docx,.txt,.md">
          <span id="resume-status" class="hint">no resume uploaded</span>
        </label>
        <button class="btn" id="btn-save-profile">Save profile</button>
      </div>
      <div class="resume-info" id="resume-info" hidden>
        <strong>Parsed skills:</strong> <span id="resume-skills"></span>
      </div>
    </section>

    <!-- ============ FILTERS ============ -->
    <section class="card">
      <h2>Job filters</h2>
      <div class="grid three">
        <label>Preferred roles (keywords)
          <input id="f-keywords" placeholder="python, ai, backend, fullstack">
        </label>
        <label>Location (comma separated, optional)
          <input id="f-locations" placeholder="remote, india">
        </label>
        <label>Max jobs to fetch
          <input id="f-limit" type="number" value="40" min="1" max="200">
        </label>
        <label>Salary min (USD/yr)
          <input id="f-sal-min" type="number" placeholder="e.g. 40000">
        </label>
        <label>Salary max (USD/yr)
          <input id="f-sal-max" type="number" placeholder="e.g. 150000">
        </label>
        <div class="check-group">
          <label class="check"><input id="f-startup" type="checkbox" checked> Startup only</label>
          <label class="check"><input id="f-remotive" type="checkbox" checked> Remotive</label>
          <label class="check"><input id="f-jobicy" type="checkbox" checked> Jobicy</label>
        </div>
      </div>
      <div class="row actions">
        <button class="btn primary" id="btn-search">🔎 Search jobs</button>
        <button class="btn" id="btn-match" disabled>📊 Score vs resume</button>
        <button class="btn ghost" id="btn-reset">Reset</button>
      </div>
      <p class="hint" id="search-status"></p>
    </section>

    <!-- ============ RESULTS ============ -->
    <section class="card" id="results-card" hidden>
      <div class="row between">
        <h2>Results <span class="count" id="result-count"></span></h2>
        <div class="row">
          <label class="check"><input id="f-startup-only-view" type="checkbox" checked> startups only</label>
          <label class="check"><input id="f-scored" type="checkbox"> scored only</label>
        </div>
      </div>
      <div id="job-list" class="job-list"></div>
    </section>

    <!-- ============ TRACKER ============ -->
    <section class="card" id="tracker-card" hidden>
      <h2>Application tracker</h2>
      <div id="tracker-list" class="tracker-list"></div>
    </section>
  </main>

  <!-- ============ TAILOR MODAL ============ -->
  <div class="modal-backdrop" id="tailor-modal" hidden>
    <div class="modal">
      <div class="modal-head">
        <h3 id="tailor-title">Tailored docs</h3>
        <button class="btn ghost" id="btn-close-modal">✕</button>
      </div>
      <div class="modal-body">
        <div class="row between">
          <label class="check"><input id="tailor-template" type="checkbox"> fast template (no AI)</label>
          <button class="btn primary" id="btn-generate">Generate docs</button>
        </div>
        <h4>Cover letter</h4>
        <pre id="tailor-cover"></pre>
        <h4>Resume summary</h4>
        <pre id="tailor-summary"></pre>
        <p class="hint" id="tailor-file"></p>
        <div class="row actions">
          <button class="btn" id="btn-open-job">Open application page</button>
          <span class="spacer"></span>
          <button class="btn" data-log="applied">✅ Applied</button>
          <button class="btn ghost" data-log="skipped">⏭ Skipped</button>
          <button class="btn ghost" data-log="rejected">✖ Rejected</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="/static/app.js"></script>
</body>
</html>
