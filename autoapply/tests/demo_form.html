<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Demo Application Form</title>
</head>
<body>
  <h1>Demo Application</h1>
  <form id="app-form">
    <label>Full name <input id="full_name" name="fullName" placeholder="Full name"></label><br>
    <label>Email <input id="email" type="email" name="email" placeholder="Email"></label><br>
    <label>Phone <input id="phone" type="tel" name="phone" placeholder="Phone"></label><br>
    <label>LinkedIn <input id="linkedin" name="linkedin" placeholder="LinkedIn URL"></label><br>
    <label>Resume <input type="file" name="resume" accept=".pdf,.docx"></label><br>
    <button type="submit">Submit Application</button>
  </form>
</body>
</html>
