# ============================================================
# autoapply configuration
# ============================================================

candidate:
  name: "Sarga Prasad RS"
  email: "sargaprasadrs@gmail.com"
  phone: ""
  headline: "Full-stack developer & AI engineer"
  summary: |
    I build web apps and AI/LLM tooling end to end (Python, TypeScript,
    React, FastAPI). I have shipped side projects and worked on
    production codebases; I like small teams where I can own things.
  skills: [python, typescript, react, node, fastapi, postgres, docker, llms, playwright, selenium, scraping]
  resume_path: ""                    # path to your resume (PDF or DOCX)
  linkedin: ""

search:
  # keywords matched against job title + description
  keywords: ["python", "ai", "developer", "software engineer", "backend", "fullstack"]
  limit: 40                          # max jobs to fetch per run
  locations: []                      # e.g. ["remote", "india"] - empty = all

# ------------------------------------------------------------
# Job sources. remotive + jobicy are free & keyless.
# Adzuna needs an app_id/app_key (https://developer.adzuna.com).
# ------------------------------------------------------------
sources:
  remotive: {enabled: true}
  jobicy: {enabled: true}
  adzuna:
    enabled: false
    app_id: ""
    app_key: ""
    country: "gb"

# ------------------------------------------------------------
# Matching. match_mode: "keywords" (fast, offline) or "ai" (Ollama, slow)
# ------------------------------------------------------------
match:
  mode: "keywords"                   # keywords | ai
  min_score: 30                      # jobs below this are filtered out

# ------------------------------------------------------------
# Ollama (local LLM) for tailoring + optional AI matching.
# deepseek-r1:8b works on this machine (gemma4 crashed - avoid).
# ------------------------------------------------------------
ollama:
  base_url: "http://localhost:11434"
  model: "deepseek-r1:8b"
  use_ai: true

apply:
  # how long to wait (seconds) for the application page to load
  page_timeout: 45
